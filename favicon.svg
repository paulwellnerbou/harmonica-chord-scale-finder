<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="15" fill="#f6efe1"/>
  <!-- Filled shapes rather than the strokes of the header mark: at a 16px tab
       icon a 2px stroke lands under one device pixel and the harp turns to mush. -->
  <g fill="#a9670f">
    <rect x="8" y="17" width="48" height="9" rx="2"/>
    <rect x="8" y="38" width="48" height="9" rx="2"/>
    <rect x="2" y="24" width="60" height="16" rx="3"/>
  </g>
  <rect x="8" y="28" width="48" height="8" fill="#f6efe1"/>
  <g fill="#a9670f">
    <rect x="15.2" y="28" width="3" height="8"/>
    <rect x="25.4" y="28" width="3" height="8"/>
    <rect x="35.6" y="28" width="3" height="8"/>
    <rect x="45.8" y="28" width="3" height="8"/>
  </g>
</svg>
